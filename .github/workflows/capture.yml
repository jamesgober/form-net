name: Capture

# Captures the bodies Safari sends for the capture page (tools/capture), on a
# macOS runner through safaridriver, for tests/corpus/browsers. Run by hand;
# the captures come back as an artifact to commit after review.

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  safari:
    name: Safari
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Enable safaridriver
        run: sudo safaridriver --enable
      - name: Capture
        run: |
          safaridriver -p 4444 &
          python3 tools/capture/capture.py --port 8765 --out captures &
          server=$!
          python3 tools/capture/webdriver.py --driver http://127.0.0.1:4444 \
            --browser safari --url "http://127.0.0.1:8765/?auto=multipart"
          wait "$server"
      - name: Name the capture by version
        run: |
          agent=$(cat captures/user-agent)
          echo "$agent"
          version=$(echo "$agent" | sed -n 's|.*Version/\([0-9]*\).*Safari/.*|\1|p')
          test -n "$version"
          mkdir -p out
          mv captures "out/safari-$version"
          sw_vers
      - uses: actions/upload-artifact@v4
        with:
          name: safari-capture
          path: out/
          if-no-files-found: error
