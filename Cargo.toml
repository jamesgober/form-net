# =============================================================================
#  R E P S   ·   form-net
# =============================================================================
[package]
name    = "form-net"
version = "0.3.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Sans-IO form parsing for Rust: application/x-www-form-urlencoded and streaming multipart/form-data, with budgets checked before allocation, safe upload spilling, and typed extraction. No third-party dependencies."

# Keywords (5 max)
keywords = ["form", "multipart", "urlencoded", "upload", "http"]

# Categories
categories = ["web-programming", "parser-implementations", "no-std"]

# Links
homepage      = "https://github.com/jamesgober/form-net"
repository    = "https://github.com/jamesgober/form-net"
documentation = "https://docs.rs/form-net"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

# The fuzz crate is its own workspace and never ships.
exclude = ["/fuzz/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "form_net"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]

# Owned results, Tier 1 parsing, the multipart parser's own buffer.
alloc = []

# std::io adapters and FormError::Io; implies alloc.
std = ["alloc"]


# DEPENDENCIES
# #################################
[dependencies]
# First-party grammar for media types, parameters, Content-Disposition, and
# RFC 8187 values (dev/PLAN.md D-006). no_std, no allocation.
parse-net = { version = "0.6.1", default-features = false }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }


# EXAMPLES
# #################################
[[example]]
name = "urlencoded_basic"
required-features = ["alloc"]

[[example]]
name = "query_string"
required-features = ["alloc"]

[[example]]
name = "multipart_buffered"
required-features = ["alloc"]

[[example]]
name = "multipart_sans_io"
required-features = ["alloc"]


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
