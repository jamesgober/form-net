# =============================================================================
#  R E P S   ·   form-net
# =============================================================================
[package]
name    = "form-net"
version = "0.6.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Sans-IO form parsing for Rust: application/x-www-form-urlencoded and streaming multipart/form-data, with budgets checked before allocation, safe upload spilling, and typed extraction. No third-party dependencies."

# Keywords (5 max)
keywords = ["form", "multipart", "urlencoded", "upload", "http"]

# Categories
categories = ["web-programming", "parser-implementations", "no-std"]

# Links
homepage      = "https://github.com/jamesgober/form-net"
repository    = "https://github.com/jamesgober/form-net"
documentation = "https://docs.rs/form-net"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

# The fuzz crate is its own workspace and never ships.
exclude = ["/fuzz/", "/benches/", "/tools/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "form_net"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]

# Owned results, Tier 1 parsing, typed extraction, the hook driver.
# Owned values are wiped through crypt-io (volatile writes, D-083).
alloc = ["dep:crypt-io"]

# std::io adapters and FormError::Io; implies alloc.
std = ["alloc"]

# The OS random source, for temporary names and generated boundaries.
random = ["std", "dep:mod-rand"]

# Upload storage: private temporary files, StoredFile, Upload, UploadSession.
fs = ["std", "random", "dep:path-lib"]

# NFC file names: FileName::nfc, and NFC first in FileName::sanitized.
unicode = ["alloc", "dep:unicode-lang"]


# DEPENDENCIES
# #################################
[dependencies]
# First-party grammar for media types, parameters, Content-Disposition, and
# RFC 8187 values (dev/PLAN.md D-006). no_std, no allocation.
parse-net = { version = "0.6.1", default-features = false }

# First-party: volatile wiping of owned values (the audited-cryptography
# exception of the portfolio standard; pulls zeroize and subtle, D-083).
crypt-io = { version = "1.2.1", default-features = false, features = ["zeroize"], optional = true }

# First-party: the OS CSPRNG (tier3::fill_bytes) for random names.
mod-rand = { version = "1", default-features = false, features = ["tier3"], optional = true }

# First-party: path_lib::sanitize for FileName::sanitized.
path-lib = { version = "1", optional = true }

# First-party: Unicode NFC for file names (macOS clients may send NFD).
unicode-lang = { version = "1.0.1", default-features = false, features = ["alloc"], optional = true }



# DEV DEPENDENCIES
# #################################
[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

# The model checker for SpillQuota, only under `--cfg loom` (CI job `loom`).
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }


# EXAMPLES
# #################################
[[example]]
name = "urlencoded_basic"
required-features = ["alloc"]

[[example]]
name = "query_string"
required-features = ["alloc"]

[[example]]
name = "multipart_buffered"
required-features = ["alloc"]

[[example]]
name = "multipart_sans_io"
required-features = ["alloc"]


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"

[[example]]
name = "typed_form"
required-features = ["alloc"]

[[example]]
name = "content_inspector"
required-features = ["alloc"]

[[example]]
name = "upload_to_disk"
required-features = ["fs"]

[[example]]
name = "upload_session_push"
required-features = ["fs"]

[[example]]
name = "token_first"
required-features = ["fs"]

[[example]]
name = "build_multipart_client"
required-features = ["random"]
