path = "fuzz_targets/fuzz_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_boundary"
path = "fuzz_targets/fuzz_boundary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_multipart"
path = "fuzz_targets/fuzz_multipart.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_multipart_differential"
path = "fuzz_targets/fuzz_multipart_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_part_headers"
path = "fuzz_targets/fuzz_part_headers.rs"
test = false
