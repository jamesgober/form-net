[package]
name = "form-net-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.form-net]
path = ".."
features = ["fs"]

# Keeps this crate out of any parent workspace.
[workspace]
members = ["."]

[[bin]]
name = "fuzz_detect"
path = "fuzz_targets/fuzz_detect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_raw_pairs"
path = "fuzz_targets/fuzz_raw_pairs.rs"
test = false
doc = false
bench = false

